name: deploy

# Push to main is the deploy. The image is built here, published to GHCR, and
# the droplet is told to pull it — so shipping never requires touching the
# server by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # The module has no dependencies and therefore no go.sum, which is
          # what the module cache keys on. Asking for it only produces a
          # "dependencies file is not found" warning on every run.
          cache: false
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with both latest and the commit sha: latest is what the server
      # pulls, the sha is what a rollback points at.
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull the new image on the droplet
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_ed25519 <<< "$SSH_KEY"
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            set -euo pipefail
            cd /opt/portfolio
            docker compose pull
            docker compose up -d
            docker image prune -f
          '

      - name: Verify the site is answering
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
                 'curl -fsS --max-time 5 http://localhost:3000/healthz' >/dev/null; then
              echo "healthy"
              exit 0
            fi
            echo "not ready yet (attempt $attempt), waiting"
            sleep 3
          done
          echo "the container never became healthy" >&2
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'docker compose -f /opt/portfolio/docker-compose.yml logs --tail 50' >&2
          exit 1
