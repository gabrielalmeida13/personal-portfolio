# Local / home-server deployment.
#   docker compose up --build -d   build and start in the background
#   docker compose logs -f         follow logs
#   docker compose down            stop and remove

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: gabriel-portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      # Runtime credentials (Spotify, GitHub). Optional: without them the site
      # still serves, with the record resting and the repository panel empty.
      - path: .env.local
        required: false
    environment:
      - PORT=3000
